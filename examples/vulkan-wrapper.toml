version = 1

[generator]
namespace = "vk"
module = "vulkan.wrapper"
api = "vulkan"
minimum_core = "1.3"
# Emit the registry's doc comments as /// comments on the generated entities.
emit_docs = false
# Wrap externsync'd commands in exclusive locks and all other handle accesses in
# shared locks. Set false to omit the locking for zero-overhead when the app
# performs its own external synchronization.
externsync = true

[filters]
include_extensions = ["*"]
exclude_extensions = []
exclude_commands = []
exclude_types = []

[naming.types]

[naming.commands]
